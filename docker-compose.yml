version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: openprep_postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=openprep
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - openprep_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d openprep']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openprep_redis
    ports:
      - '6379:6379'
    networks:
      - openprep_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openprep_backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/openprep
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret_here
      - GEMINI_API_KEY=your_gemini_api_key_here
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openprep_net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    container_name: openprep_frontend
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - openprep_net

volumes:
  pg_data:

networks:
  openprep_net:
    driver: bridge
