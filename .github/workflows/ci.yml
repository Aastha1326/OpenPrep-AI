name: OpenPrep AI CI

on:
  push:
    branches: [ main, master, feature/test-coverage ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Run Linting
        run: npm run lint --if-present

  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Backend Dependencies
        run: npm install --no-audit
        working-directory: backend

      - name: Run Backend Tests
        run: npm test
        working-directory: backend
        env:
          DATABASE_URL_TEST: postgres://postgres@localhost:5432/postgres
          JWT_SECRET: "testsecret"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Frontend Dependencies
        run: npm install --no-audit
        working-directory: frontend

      - name: Run Frontend Tests
        run: npm test
        working-directory: frontend

  build:
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Frontend Dependencies
        run: npm install --no-audit
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend

  lighthouse:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Frontend Dependencies
        run: npm install --no-audit
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend

      - name: Audit with Lighthouse CI
        run: npx @lhci/cli@0.14.x autorun

